services:
  db:
    image: postgres:15.3-alpine
    container_name: betternews-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: betternews_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - betternews-network

networks:
  betternews-network:
    driver: bridge

volumes:
  db_data: