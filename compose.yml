services:
  db:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: betternewsdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - betternews-network
    ports:
      - "5432:5432"

networks:
  betternews-network:
    driver: bridge

volumes:
  postgres_data: